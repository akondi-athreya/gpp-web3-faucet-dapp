version: "3.8"

services:
  web3-faucet:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web3-faucet-dapp
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - VITE_TOKEN_ADDRESS=${VITE_TOKEN_ADDRESS:-0x426C1217EE4B94dcb63BD9561864Ec72F8B9e2df}
      - VITE_FAUCET_ADDRESS=${VITE_FAUCET_ADDRESS:-0xb65a086501207b787c60b2e9bA9dCD2c147bc654}
      - VITE_RPC_URL=${VITE_RPC_URL:-https://sepolia.infura.io/v3/9aa3d95b3bc440fa88ea12eaa4456161}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - web3-network

networks:
  web3-network:
    driver: bridge
