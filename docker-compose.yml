services:
  web3-faucet:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web3-faucet-dapp
    ports:
      - "3000:5000"
    environment:
      - PORT=5000
      - VITE_TOKEN_ADDRESS=${VITE_TOKEN_ADDRESS:-0xC03C396369C2876949dd0Cc228214927c00b80aC}
      - VITE_FAUCET_ADDRESS=${VITE_FAUCET_ADDRESS:-0xf3762351Bc172cb9C709cd7385Fa0889E75860E2}
      - VITE_RPC_URL=${VITE_RPC_URL:-https://1rpc.io/sepolia}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - web3-network

networks:
  web3-network:
    driver: bridge
